name: llm-gateway-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  mock:
    build: .
    command: ["uvicorn", "llm_gateway_api.mock_upstream:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
  migrate:
    build: .
    env_file: .env
    environment:
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres/gateway
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {disable: true}
  gateway:
    build: .
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres/gateway
      GATEWAY_REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - spool-data:/app/var/spool
      - ./examples/prompt_bundles:/app/examples/prompt_bundles:ro
      - ./config:/app/config:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mock: {condition: service_started}
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      GATEWAY_TEST_DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres/gateway_test
      GATEWAY_TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["./test-results:/app/test-results"]
volumes:
  postgres-data:
  redis-data:
  spool-data:
