[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway-services"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
description = "Gateway application services and Prompt lifecycle"
dependencies = ["llm-gateway-core==0.1.0", "jinja2>=3.1.6,<4", "pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway_services"]
