[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway-infrastructure"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
description = "Gateway PostgreSQL/Redis, provider protocols, telemetry and notifications"
dependencies = [
  "llm-gateway-core==0.1.0", "pydantic>=2.10,<3", "httpx>=0.28,<0.29", "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1", "redis>=5.2,<7", "alembic>=1.14,<2", "pyyaml>=6,<7",
  "cryptography>=44,<47", "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway_infrastructure"]
