[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
description = "FastAPI HTTP entry point and dependency composition"
dependencies = ["llm-gateway-core==0.1.0", "llm-gateway-services==0.1.0",
                "llm-gateway-infrastructure==0.1.0", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
                "pydantic>=2.10,<3", "redis>=5.2,<7", "prometheus-client>=0.21,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway_api"]
